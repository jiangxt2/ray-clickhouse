services:
  clickhouse:
    image: ${RAY_CLICKHOUSE_IT_IMAGE:-docker.m.daocloud.io/clickhouse/clickhouse-server@sha256:1ffa82edee000a42c09313bd9f1293d94c570aee74babc1b3ca9983a35fa597b}
    environment:
      CLICKHOUSE_DB: ray_clickhouse_it
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "18123:8123"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: "no"
