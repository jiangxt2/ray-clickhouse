[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ray-clickhouse-official-comparison"
version = "0.1.0"
description = "Reproducible Ray ClickHouse public API comparison harness"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
runtime = [
  "clickhouse-connect[arrow]==1.5.0",
  "jsonschema>=4.23,<5",
  "pyarrow==19.0.1",
]
dev = [
  "build>=1.2.2,<2",
  "clickhouse-connect[arrow]==1.5.0",
  "hatchling>=1.27,<2",
  "jsonschema>=4.23,<5",
  "mypy>=1.17,<2",
  "pyarrow==19.0.1",
  "pyarrow-stubs>=19,<20",
  "pytest>=8.3,<10",
  "ruff==0.16.4",
  "twine>=7,<8",
  "types-jsonschema>=4.23,<5",
]

[project.scripts]
ray-clickhouse-comparison = "ray_clickhouse_comparison.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ray_clickhouse_comparison"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/ray_clickhouse_comparison"]
