[project]
name = "ray-clickhouse"
version = "0.1.0"
description = "Ray Data read and append connector for ClickHouse physical tables"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "Apache-2.0"}
authors = [{name = "jiangxt2"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "clickhouse-connect[arrow]>=1.5,<1.6",
    "pyarrow>=19,<20",
    "ray[data]>=2.55,<2.59",
    "typing-extensions>=4.12,<5",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.2,<2",
    "mypy>=1.17,<2",
    "pyarrow-stubs>=19,<20",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "pytest-timeout>=2.3,<3",
    "ruff==0.16.4",
    "twine>=7,<8",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ray_clickhouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires a real ClickHouse service",
    "ray: requires a Ray runtime",
    "cluster: requires a multi-node Ray cluster",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["ray_clickhouse"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ray_clickhouse"]
