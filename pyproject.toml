[project]
name = "ray-clickhouse"
version = "0.1.0"
description = "Ray Data read and append connector for ClickHouse physical tables"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "Apache-2.0"}
authors = [{name = "jiangxt2"}]
dependencies = [
    "clickhouse-connect[arrow]>=1.5,<1.6",
    "pyarrow>=19,<20",
    "ray[data]>=2.55,<2.56",
    "typing-extensions>=4.12,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12.8,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ray_clickhouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires a real ClickHouse service",
    "ray: requires a Ray runtime",
    "cluster: requires a multi-node Ray cluster",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["ray_clickhouse"]
