            echo "- Artifact digest: ${RECEIPT_DIGEST}"
            echo "- Artifact URL: ${RECEIPT_URL}"
          } >> "${GITHUB_STEP_SUMMARY}"

  release-tag:
    name: Create annotated release tag
    if: inputs.operation == 'release-tag'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-tag
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.candidate-sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.validate.outputs.validated-input-id }}
          digest-mismatch: error
          path: validated
      - name: Revalidate TestPyPI files
        run: >-
          python3 tools/check_release.py verify-index
          --json-url https://test.pypi.org/pypi/ray-clickhouse/json
          --sha256sums validated/candidate-distributions/SHA256SUMS
          --output testpypi-state.json
      - name: Create or recover annotated tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.validate.outputs.candidate-sha }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v0.1.0" > tag-ref.json 2>/dev/null; then
            test "$(jq -r '.object.type' tag-ref.json)" = "tag"
            tag_object=$(jq -r '.object.sha' tag-ref.json)
            gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" > tag-object.json
            test "$(jq -r '.object.type' tag-object.json)" = "commit"
            test "$(jq -r '.object.sha' tag-object.json)" = "${CANDIDATE_SHA}"
            result=recovered
          else
            tag_object=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/tags" \
              -f tag=v0.1.0 \
              -f message='ray-clickhouse 0.1.0' \
              -f object="${CANDIDATE_SHA}" \
              -f type=commit --jq '.sha')
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref=refs/tags/v0.1.0 -f sha="${tag_object}" >/dev/null
            result=success
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v0.1.0" > tag-ref.json
          test "$(jq -r '.object.type' tag-ref.json)" = "tag"
          tag_object=$(jq -r '.object.sha' tag-ref.json)
          gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" > tag-object.json
          test "$(jq -r '.tag' tag-object.json)" = "v0.1.0"
          test "$(jq -r '.object.type' tag-object.json)" = "commit"
          test "$(jq -r '.object.sha' tag-object.json)" = "${CANDIDATE_SHA}"
          git fetch --force --no-tags origin \
            refs/tags/v0.1.0:refs/tags/v0.1.0
          test "$(git cat-file -t refs/tags/v0.1.0)" = "tag"
          test "$(git rev-parse 'refs/tags/v0.1.0^{}')" = "${CANDIDATE_SHA}"
          jq -n --arg operation release-tag --arg result "${result}" \
            --arg tag v0.1.0 --arg target "${CANDIDATE_SHA}" \
            '{operation:$operation,result:$result,tag:$tag,tag_type:"annotated",target:$target}' \
            > external-state.json
          echo "result=${result}" >> "${GITHUB_OUTPUT}"
      - name: Create release-tag receipt
        env:
          RUN_ID: ${{ github.run_id }}
          RECORD_ID: ${{ inputs.candidate_record_artifact_id }}
          RECORD_DIGEST: ${{ inputs.candidate_record_artifact_digest }}
          PREDECESSOR_RUN_ID: ${{ inputs.predecessor_run_id }}
          PREDECESSOR_ID: ${{ inputs.predecessor_receipt_artifact_id }}
          PREDECESSOR_DIGEST: ${{ inputs.predecessor_receipt_artifact_digest }}
          RESULT: ${{ steps.tag.outputs.result }}
        run: >-
          python3 tools/check_release.py create-promotion-receipt
          --output promotion-receipt.json
          --operation release-tag
          --run-id "${RUN_ID}"
          --candidate validated/candidate-record/release-candidate.json
          --candidate-record-id "${RECORD_ID}"
          --candidate-record-digest "${RECORD_DIGEST}"
          --predecessor validated/predecessor/promotion-receipt.json
          --predecessor-run-id "${PREDECESSOR_RUN_ID}"
          --predecessor-artifact-id "${PREDECESSOR_ID}"
          --predecessor-artifact-digest "${PREDECESSOR_DIGEST}"
          --external-state external-state.json
          --result "${RESULT}"
      - name: Upload release-tag receipt
        id: upload-receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-receipt-release-tag
          path: promotion-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Record promotion receipt identity
        env:
          RECEIPT_ID: ${{ steps.upload-receipt.outputs.artifact-id }}
          RECEIPT_DIGEST: ${{ steps.upload-receipt.outputs.artifact-digest }}
          RECEIPT_URL: ${{ steps.upload-receipt.outputs.artifact-url }}
        run: |
          {
            echo "## Promotion receipt: release-tag"
            echo "- Artifact ID: ${RECEIPT_ID}"
            echo "- Artifact digest: ${RECEIPT_DIGEST}"
            echo "- Artifact URL: ${RECEIPT_URL}"
          } >> "${GITHUB_STEP_SUMMARY}"

  pypi:
    name: Publish PyPI
    if: inputs.operation == 'pypi'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.candidate-sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.validate.outputs.validated-input-id }}
          digest-mismatch: error
          path: validated
      - name: Revalidate TestPyPI and annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.validate.outputs.candidate-sha }}
        run: |
          python3 tools/check_release.py verify-index \
            --json-url https://test.pypi.org/pypi/ray-clickhouse/json \
            --sha256sums validated/candidate-distributions/SHA256SUMS
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v0.1.0" > tag-ref.json
          test "$(jq -r '.object.type' tag-ref.json)" = "tag"
          tag_object=$(jq -r '.object.sha' tag-ref.json)
          gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" > tag-object.json
          test "$(jq -r '.tag' tag-object.json)" = "v0.1.0"
          test "$(jq -r '.object.type' tag-object.json)" = "commit"
          test "$(jq -r '.object.sha' tag-object.json)" = "${CANDIDATE_SHA}"
          git fetch --force --no-tags origin \
            refs/tags/v0.1.0:refs/tags/v0.1.0
          test "$(git cat-file -t refs/tags/v0.1.0)" = "tag"
          test "$(git rev-parse 'refs/tags/v0.1.0^{}')" = "${CANDIDATE_SHA}"
      - name: Check PyPI state
        id: state
        run: |
          code=$(curl -sS -o pypi.json -w '%{http_code}' \
            https://pypi.org/pypi/ray-clickhouse/json)
          if [[ "${code}" == "200" ]]; then
            python3 tools/check_release.py verify-index \
              --json-url https://pypi.org/pypi/ray-clickhouse/json \
              --sha256sums validated/candidate-distributions/SHA256SUMS \
              --output external-state.json
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "result=recovered" >> "${GITHUB_OUTPUT}"
          elif [[ "${code}" == "404" ]]; then
            mkdir publish-dist
            cp validated/candidate-distributions/*.whl publish-dist/
            cp validated/candidate-distributions/*.tar.gz publish-dist/
            echo "publish=true" >> "${GITHUB_OUTPUT}"
            echo "result=success" >> "${GITHUB_OUTPUT}"
          else
            echo "PyPI returned HTTP ${code}" >&2
            exit 1
          fi
      - name: Publish package distributions to PyPI
        if: steps.state.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: publish-dist/
          attestations: true
      - name: Verify PyPI identity
        run: |
          for attempt in {1..12}; do
            if python3 tools/check_release.py verify-index \
              --json-url https://pypi.org/pypi/ray-clickhouse/json \
              --sha256sums validated/candidate-distributions/SHA256SUMS \
              --output external-state.json; then
              break
            fi
            test "${attempt}" -lt 12
            sleep 5
          done
      - name: Create PyPI receipt
        env:
          RUN_ID: ${{ github.run_id }}
          RECORD_ID: ${{ inputs.candidate_record_artifact_id }}
          RECORD_DIGEST: ${{ inputs.candidate_record_artifact_digest }}
          PREDECESSOR_RUN_ID: ${{ inputs.predecessor_run_id }}
          PREDECESSOR_ID: ${{ inputs.predecessor_receipt_artifact_id }}
          PREDECESSOR_DIGEST: ${{ inputs.predecessor_receipt_artifact_digest }}
          RESULT: ${{ steps.state.outputs.result }}
        run: >-
          python3 tools/check_release.py create-promotion-receipt
          --output promotion-receipt.json
          --operation pypi
          --run-id "${RUN_ID}"
          --candidate validated/candidate-record/release-candidate.json
          --candidate-record-id "${RECORD_ID}"
          --candidate-record-digest "${RECORD_DIGEST}"
          --predecessor validated/predecessor/promotion-receipt.json
          --predecessor-run-id "${PREDECESSOR_RUN_ID}"
          --predecessor-artifact-id "${PREDECESSOR_ID}"
          --predecessor-artifact-digest "${PREDECESSOR_DIGEST}"
          --external-state external-state.json
          --result "${RESULT}"
      - name: Upload PyPI receipt
        id: upload-receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-receipt-pypi
          path: promotion-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Record promotion receipt identity
        env:
          RECEIPT_ID: ${{ steps.upload-receipt.outputs.artifact-id }}
          RECEIPT_DIGEST: ${{ steps.upload-receipt.outputs.artifact-digest }}
          RECEIPT_URL: ${{ steps.upload-receipt.outputs.artifact-url }}
        run: |
          {
            echo "## Promotion receipt: pypi"
            echo "- Artifact ID: ${RECEIPT_ID}"
            echo "- Artifact digest: ${RECEIPT_DIGEST}"
            echo "- Artifact URL: ${RECEIPT_URL}"
          } >> "${GITHUB_STEP_SUMMARY}"

  github-release:
    name: Create GitHub Release
    if: inputs.operation == 'github-release'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: github-release
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.candidate-sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.validate.outputs.validated-input-id }}
          digest-mismatch: error
          path: validated
      - name: Revalidate PyPI and tag
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.validate.outputs.candidate-sha }}
        run: |
          python3 tools/check_release.py verify-index \
            --json-url https://pypi.org/pypi/ray-clickhouse/json \
            --sha256sums validated/candidate-distributions/SHA256SUMS
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v0.1.0" > tag-ref.json
          test "$(jq -r '.object.type' tag-ref.json)" = "tag"
          tag_object=$(jq -r '.object.sha' tag-ref.json)
          gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" > tag-object.json
          test "$(jq -r '.tag' tag-object.json)" = "v0.1.0"
          test "$(jq -r '.object.type' tag-object.json)" = "commit"
          test "$(jq -r '.object.sha' tag-object.json)" = "${CANDIDATE_SHA}"
          git fetch --force --no-tags origin \
            refs/tags/v0.1.0:refs/tags/v0.1.0
          test "$(git cat-file -t refs/tags/v0.1.0)" = "tag"
          test "$(git rev-parse 'refs/tags/v0.1.0^{}')" = "${CANDIDATE_SHA}"
      - name: Create or recover GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.validate.outputs.candidate-sha }}
        run: |
          if gh release view v0.1.0 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            result=recovered
          else
            gh release create v0.1.0 \
              validated/candidate-distributions/*.whl \
              validated/candidate-distributions/*.tar.gz \
              validated/candidate-distributions/SHA256SUMS \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "ray-clickhouse 0.1.0" \
              --notes-file release-notes/v0.1.0.md
            result=success
          fi
          gh release view v0.1.0 --repo "${GITHUB_REPOSITORY}" \
            --json id,isDraft,isPrerelease,tagName,url > release-state.json
          test "$(jq -r '.tagName' release-state.json)" = "v0.1.0"
          test "$(jq -r '.isDraft' release-state.json)" = "false"
          test "$(jq -r '.isPrerelease' release-state.json)" = "false"
          mkdir release-download
          gh release download v0.1.0 --repo "${GITHUB_REPOSITORY}" \
            --dir release-download
          python3 tools/check_release.py record-github-release-state \
            --directory release-download \
            --sha256sums validated/candidate-distributions/SHA256SUMS \
            --candidate-sha "${CANDIDATE_SHA}" \
            --output external-state.json
          echo "result=${result}" >> "${GITHUB_OUTPUT}"
      - name: Create GitHub Release receipt
        env:
          RUN_ID: ${{ github.run_id }}
          RECORD_ID: ${{ inputs.candidate_record_artifact_id }}
          RECORD_DIGEST: ${{ inputs.candidate_record_artifact_digest }}
          PREDECESSOR_RUN_ID: ${{ inputs.predecessor_run_id }}
          PREDECESSOR_ID: ${{ inputs.predecessor_receipt_artifact_id }}
          PREDECESSOR_DIGEST: ${{ inputs.predecessor_receipt_artifact_digest }}
          RESULT: ${{ steps.release.outputs.result }}
        run: >-
          python3 tools/check_release.py create-promotion-receipt
          --output promotion-receipt.json
          --operation github-release
          --run-id "${RUN_ID}"
          --candidate validated/candidate-record/release-candidate.json
          --candidate-record-id "${RECORD_ID}"
          --candidate-record-digest "${RECORD_DIGEST}"
          --predecessor validated/predecessor/promotion-receipt.json
          --predecessor-run-id "${PREDECESSOR_RUN_ID}"
          --predecessor-artifact-id "${PREDECESSOR_ID}"
          --predecessor-artifact-digest "${PREDECESSOR_DIGEST}"
          --external-state external-state.json
          --result "${RESULT}"
      - name: Upload GitHub Release receipt
        id: upload-receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-receipt-github-release
          path: promotion-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Record promotion receipt identity
        env:
          RECEIPT_ID: ${{ steps.upload-receipt.outputs.artifact-id }}
          RECEIPT_DIGEST: ${{ steps.upload-receipt.outputs.artifact-digest }}
          RECEIPT_URL: ${{ steps.upload-receipt.outputs.artifact-url }}
        run: |
          {
            echo "## Promotion receipt: github-release"
            echo "- Artifact ID: ${RECEIPT_ID}"
            echo "- Artifact digest: ${RECEIPT_DIGEST}"
            echo "- Artifact URL: ${RECEIPT_URL}"
          } >> "${GITHUB_STEP_SUMMARY}"
