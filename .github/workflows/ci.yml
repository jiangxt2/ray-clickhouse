name: CI

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Immutable release candidate commit to test
        required: false
        type: string
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Resolve candidate commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - id: resolve
        name: Validate immutable candidate SHA
        shell: bash
        env:
          INPUT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          candidate_sha="${INPUT_CANDIDATE_SHA:-${GITHUB_SHA}}"
          if [[ ! "${candidate_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          echo "sha=${candidate_sha}" >> "${GITHUB_OUTPUT}"

  unit:
    name: Python ${{ matrix.python }} / Ray ${{ matrix.ray }}
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            ray: "2.55.0"
          - python: "3.12"
            ray: "2.56.1"
          - python: "3.12"
            ray: "2.57.0"
          - python: "3.12"
            ray: "2.58.0"
          - python: "3.10"
            ray: "2.58.0"
          - python: "3.11"
            ray: "2.58.0"
          - python: "3.13"
            ray: "2.58.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python }}
      - run: uv venv --python ${{ matrix.python }}
      - run: uv pip install -e ".[dev]" "ray[data]==${{ matrix.ray }}"
      - name: Show resolved runtime versions
        run: >-
          .venv/bin/python -c
          "from importlib.metadata import version;
          print('python=' + __import__('platform').python_version());
          print('ray=' + version('ray'));
          print('pyarrow=' + version('pyarrow'));
          print('clickhouse-connect=' + version('clickhouse-connect'))"
      - run: >-
          .venv/bin/python -m pytest tests/unit tests/contract
          --cov=ray_clickhouse --cov-report=term-missing
        env:
          RAY_ENABLE_UV_RUN_RUNTIME_ENV: "0"
          RAY_USAGE_STATS_ENABLED: "0"

  quality:
    name: Static quality
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --frozen
      - run: uv lock --check
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/ruff check .
      - run: .venv/bin/mypy
      - run: .venv/bin/python tools/check_compatibility.py

  clickhouse-it:
    name: ClickHouse 26.8 integration
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --frozen
      - name: Run ClickHouse integration
        run: ./scripts/run_clickhouse_it.sh
        env:
          RAY_CLICKHOUSE_IT_ARTIFACT_DIR: artifacts/it
      - name: Upload ClickHouse integration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clickhouse-26.8-integration
          path: artifacts/it
          if-no-files-found: error

  package-build:
    name: Build package
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --frozen
      - run: .venv/bin/python -m build
      - run: .venv/bin/twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/*

  package-smoke:
    name: Python ${{ matrix.python }} package smoke
    needs: [candidate, package-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
          - python: "3.11"
          - python: "3.12"
          - python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - run: uv venv --python ${{ matrix.python }} .venv-wheel
      - name: Install and check wheel
        run: |
          shopt -s nullglob
          packages=(dist/*.whl)
          test "${#packages[@]}" -eq 1
          uv pip install \
            --python .venv-wheel/bin/python \
            "ray[data]==2.58.0" \
            "${packages[0]}"
          uv pip check --python .venv-wheel/bin/python
          .venv-wheel/bin/python -c \
            "import clickhouse_connect, pyarrow, ray, ray_clickhouse; print(ray.__version__)"
      - name: Install and check source distribution
        if: matrix.python == '3.12'
        run: |
          shopt -s nullglob
          packages=(dist/*.tar.gz)
          test "${#packages[@]}" -eq 1
          uv venv --python 3.12 .venv-sdist
          uv pip install \
            --python .venv-sdist/bin/python \
            "ray[data]==2.58.0" \
            "${packages[0]}"
          uv pip check --python .venv-sdist/bin/python
          .venv-sdist/bin/python -c \
            "import clickhouse_connect, pyarrow, ray, ray_clickhouse; print(ray.__version__)"
