name: Official ClickHouse comparison

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full master-reachable Unit A commit SHA
        required: true
        type: string
      mode:
        description: Approved comparison execution mode
        required: true
        default: dry-run
        type: choice
        options: [dry-run, formal]

permissions:
  contents: read

concurrency:
  group: official-clickhouse-comparison-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  compare:
    name: ${{ inputs.mode }} / ubuntu-24.04 x64
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RAY_USAGE_STATS_ENABLED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Validate immutable candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
      - name: Verify candidate is master-reachable and is the checked-out commit
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          git fetch --no-tags origin master
          git merge-base --is-ancestor "${CANDIDATE_SHA}" origin/master
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - name: Validate locks and harness configuration
        run: |
          uv sync --project comparison/official --extra dev --frozen
          uv lock --project comparison/official --check
          uv run --project comparison/official ray-clickhouse-comparison validate \
            --reference comparison/official/config/reference.toml \
            --scenarios comparison/official/config/scenarios.toml \
            --manifest-schema comparison/official/schema/manifest.schema.json \
            --result-schema comparison/official/schema/result.schema.json
      - name: Capture runner identity
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          COMPARISON_MODE: ${{ inputs.mode }}
          RETENTION_DAYS: ${{ inputs.mode == 'formal' && '90' || '30' }}
        run: |
          set -euo pipefail
          preflight="${RUNNER_TEMP}/ray-clickhouse-comparison-preflight"
          mkdir -p "${preflight}"
          uv run --project comparison/official python -c 'import json, os, pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "ray-clickhouse-comparison-preflight", "workflow-identity.json").write_text(json.dumps({"schema_version": 1, "candidate_sha": os.environ["CANDIDATE_SHA"], "workflow_sha": os.environ["GITHUB_SHA"], "workflow_run_id": os.environ["GITHUB_RUN_ID"], "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]), "mode": os.environ["COMPARISON_MODE"], "retention_days": int(os.environ["RETENTION_DAYS"])}, sort_keys=True, indent=2) + "\n", encoding="utf-8")'
          {
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "image_os=${ImageOS:-unknown}"
            echo "image_version=${ImageVersion:-unknown}"
            uname -a
            lscpu
            free -b
            df -PT
            cat /proc/self/cgroup
            env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY \
              -u http_proxy -u https_proxy -u all_proxy docker version
            env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY \
              -u http_proxy -u https_proxy -u all_proxy docker compose version
            env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY \
              -u http_proxy -u https_proxy -u all_proxy docker info \
              --format 'cgroup_driver={{.CgroupDriver}} cgroup_version={{.CgroupVersion}} driver={{.Driver}}'
          } >"${preflight}/runner-identity.txt" 2>&1
      - name: Run approved comparison mode
        env:
          RAY_COMPARISON_ARTIFACT_DIR: ${{ runner.temp }}/ray-clickhouse-comparison-raw
          RAY_COMPARISON_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RAY_COMPARISON_WORKFLOW_SHA: ${{ github.sha }}
        run: >-
          ./scripts/run_official_comparison.sh "${{ inputs.mode }}"
          >"${RUNNER_TEMP}/ray-clickhouse-comparison-preflight/orchestration.log" 2>&1
      - name: Normalize raw evidence ownership
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          raw="${RUNNER_TEMP}/ray-clickhouse-comparison-raw"
          if [[ -d "${raw}" ]]; then
            owner="$(id -u):$(id -g)"
            sudo find "${raw}" -xdev -exec chown --no-dereference "${owner}" {} +
            sudo find "${raw}" -xdev -type d -exec chmod u+rwx {} +
            sudo find "${raw}" -xdev -type f -exec chmod u+rw {} +
          fi
      - name: Stage workflow preflight evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          raw="${RUNNER_TEMP}/ray-clickhouse-comparison-raw"
          preflight="${RUNNER_TEMP}/ray-clickhouse-comparison-preflight"
          mkdir -p "${raw}"
          for name in workflow-identity.json runner-identity.txt orchestration.log; do
            if [[ -f "${preflight}/${name}" ]]; then
              cp "${preflight}/${name}" "${raw}/${name}"
            fi
          done
      - name: Sanitize complete evidence
        id: sanitize
        if: success()
        run: >-
          uv run --project comparison/official ray-clickhouse-comparison sanitize-tree
          --input "${RUNNER_TEMP}/ray-clickhouse-comparison-raw"
          --output "${RUNNER_TEMP}/ray-clickhouse-comparison-sanitized"
          --mode "${{ inputs.mode }}"
          --scenarios comparison/official/config/scenarios.toml
          --require-complete
      - name: Sanitize failure diagnostics
        id: diagnostics
        if: always() && steps.sanitize.outcome != 'success'
        run: >-
          uv run --project comparison/official ray-clickhouse-comparison sanitize-tree
          --input "${RUNNER_TEMP}/ray-clickhouse-comparison-raw"
          --output "${RUNNER_TEMP}/ray-clickhouse-comparison-diagnostics"
      - name: Upload sanitized comparison evidence
        if: success() && steps.sanitize.outcome == 'success'
        id: evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-clickhouse-comparison-${{ inputs.mode }}-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/ray-clickhouse-comparison-sanitized
          if-no-files-found: error
          retention-days: ${{ inputs.mode == 'formal' && 90 || 30 }}
      - name: Upload failure diagnostics
        if: always() && steps.diagnostics.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-clickhouse-comparison-diagnostics-${{ inputs.mode }}-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/ray-clickhouse-comparison-diagnostics
          if-no-files-found: error
          retention-days: ${{ inputs.mode == 'formal' && 90 || 30 }}
      - name: Record artifact identity
        if: always() && steps.evidence.outcome == 'success'
        shell: bash
        run: |
          uv run --project comparison/official python - <<'PY'
          import json
          import os
          from pathlib import Path

          sanitized = Path(os.environ["RUNNER_TEMP"]) / "ray-clickhouse-comparison-sanitized"
          provenance_dir = Path(os.environ["RUNNER_TEMP"]) / "ray-clickhouse-comparison-provenance"
          provenance_dir.mkdir()
          manifest = json.loads((sanitized / "manifest.json").read_text(encoding="utf-8"))
          provenance_record = {
              "schema_version": 1,
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "workflow_sha": os.environ["WORKFLOW_SHA"],
              "harness_commit": manifest["harness"]["commit"],
              "harness_wheel_sha256": manifest["harness"]["sha256"],
              "evidence_artifact_id": os.environ["EVIDENCE_ARTIFACT_ID"],
              "evidence_artifact_digest": os.environ["EVIDENCE_ARTIFACT_DIGEST"],
              "evidence_artifact_url": os.environ["EVIDENCE_ARTIFACT_URL"],
          }
          provenance_file = provenance_dir / "artifact-provenance.json"
          provenance_file.write_text(
              json.dumps(provenance_record, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          import hashlib
          digest = hashlib.sha256(provenance_file.read_bytes()).hexdigest()
          (provenance_dir / "SHA256SUMS").write_text(
              f"{digest}  artifact-provenance.json\n", encoding="utf-8"
          )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
              stream.write(json.dumps(provenance_record, sort_keys=True) + "\n")
          PY
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          EVIDENCE_ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          EVIDENCE_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
          EVIDENCE_ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
      - name: Upload artifact provenance
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-clickhouse-comparison-provenance-${{ inputs.mode }}-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/ray-clickhouse-comparison-provenance
          if-no-files-found: error
          retention-days: ${{ inputs.mode == 'formal' && 90 || 30 }}
